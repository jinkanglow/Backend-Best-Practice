services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: guard_local_only
      POSTGRES_DB: guard_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d guard_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: guard_root_local_only
      MYSQL_USER: guard
      MYSQL_PASSWORD: guard_local_only
      MYSQL_DATABASE: guard_test
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u guard -pguard_local_only --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/mysql
